<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Search or Ask</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#E3E8E6; --panel:#F7F9F8; --ink:#16201F; --muted:#5B6B68; --line:#C9D3D0;
  --accent:#0F6B5C; --accent-ink:#FFFFFF; --chip:#E8EEEC;
  --ui:"Roboto Flex",Roboto,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  /* phone world — fixed palette, the phone is always in dark theme */
  --p-bg:#0B1514; --p-surf:#15211F; --p-surf2:#1E2C2A; --p-ink:#EAF2EF; --p-mute:#9FB2AD;
  --p-acc:#F2A541; --p-acc2:#7ED4BF; --p-line:rgba(255,255,255,.09);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1413; --panel:#161E1D; --ink:#E4ECEA; --muted:#93A5A1; --line:#2A3634;
    --accent:#5CC6B0; --accent-ink:#06201B; --chip:#1F2A28;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1413; --panel:#161E1D; --ink:#E4ECEA; --muted:#93A5A1; --line:#2A3634;
  --accent:#5CC6B0; --accent-ink:#06201B; --chip:#1F2A28;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--p-acc);outline-offset:2px}

/* ---------- stage ---------- */
.stage{min-height:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:40px;padding-block:24px;padding-inline:16px}
.phone-box{flex:none;position:relative}
.phone{position:absolute;top:0;left:0;width:390px;height:844px;transform-origin:0 0;border-radius:54px;padding:11px;
  background:linear-gradient(145deg,#2c3331,#0c100f 60%,#262d2b);box-shadow:0 0 0 1.5px #48524f inset,0 30px 60px -20px rgba(0,0,0,.45),0 12px 24px -12px rgba(0,0,0,.35)}
.phone::before,.phone::after{content:"";position:absolute;right:-3px;width:3px;background:#39423f;border-radius:0 2px 2px 0}
.phone::before{top:170px;height:64px}.phone::after{top:260px;height:110px}
.screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--p-bg);color:var(--p-ink);font-family:var(--ui);user-select:none}
.cam{position:absolute;top:13px;left:50%;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:#050807;box-shadow:0 0 0 2px #111a18;z-index:60}
.cam::after{content:"";position:absolute;top:3px;left:3px;width:4px;height:4px;border-radius:50%;background:#1b3a4a}

.statusbar{position:absolute;top:0;left:0;right:0;height:40px;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0;font-size:13.5px;font-weight:500;z-index:55;font-variant-numeric:tabular-nums;pointer-events:none}
.statusbar .icons{display:flex;gap:6px;align-items:center}
.statusbar svg{width:15px;height:15px;fill:currentColor}
.batt{display:flex;align-items:center;gap:3px;font-size:12px}
.batt i{display:block;width:22px;height:11px;border:1.4px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.batt i::after{content:"";position:absolute;inset:1.4px;right:5px;background:currentColor;border-radius:1px}

/* ---------- home ---------- */
.home{position:absolute;inset:0;padding:52px 20px 20px;display:flex;flex-direction:column;cursor:grab;
  background:
   radial-gradient(120% 60% at 85% 8%,rgba(242,165,65,.55),transparent 60%),
   radial-gradient(90% 55% at 0% 45%,rgba(40,120,104,.65),transparent 65%),
   radial-gradient(120% 70% at 60% 100%,rgba(196,84,52,.55),transparent 60%),
   linear-gradient(180deg,#14302D,#0B1716 55%,#1C1512);
  transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s}
.home.dragging{cursor:grabbing;transition:none}
.home.dim{filter:saturate(.7)}
.clock{margin-top:34px;padding:0 6px}
.clock .t{font-size:84px;font-weight:300;letter-spacing:-3px;line-height:.95;font-variation-settings:"opsz" 144;font-variant-numeric:tabular-nums}
.clock .d{margin-top:8px;font-size:15px;color:#DCE7E3;display:flex;gap:10px;align-items:center}
.clock .d span+span::before{content:"·";margin-right:10px;opacity:.6}
.pull-hint{margin:22px auto 0;font-size:12px;color:rgba(234,242,239,.6);display:flex;flex-direction:column;align-items:center;gap:4px}
.pull-hint svg{width:16px;height:16px;fill:currentColor;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.grid{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);row-gap:18px;column-gap:8px;padding:0 4px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:#EEF4F2;background:none;border:0;padding:0;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;box-shadow:0 4px 10px -4px rgba(0,0,0,.5);transition:transform .15s}
.ico svg{width:28px;height:28px;fill:#fff}
.ico.sm{width:36px;height:36px;border-radius:12px}.ico.sm svg{width:19px;height:19px}
.app:active .ico{transform:scale(.92)}
.dock{margin-top:22px;padding:12px 14px;border-radius:30px;background:rgba(255,255,255,.12);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;justify-content:space-between}
.dock .app > span:not(.ico){display:none}
.pill{margin:16px 2px 4px;height:52px;border-radius:26px;border:0;background:rgba(21,33,31,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;gap:12px;padding:0 8px 0 18px;color:var(--p-mute);font-size:15px;cursor:text;box-shadow:0 0 0 1px var(--p-line) inset}
.pill svg{width:20px;height:20px;fill:currentColor;flex:none}
.pill .grow{flex:1;text-align:left}
.pill kbd{font-family:var(--mono);font-size:10.5px;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.08);color:var(--p-mute)}
.navbar{height:18px;display:grid;place-items:center}
.navbar i{width:110px;height:4px;border-radius:2px;background:rgba(255,255,255,.75)}

/* ---------- search sheet ---------- */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(6,12,11,.35);backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);opacity:0;pointer-events:none;transition:opacity .3s,backdrop-filter .3s,-webkit-backdrop-filter .3s}
.scrim.on{opacity:1;pointer-events:auto;backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2)}
.sheet{position:absolute;left:0;right:0;top:0;bottom:0;z-index:30;display:flex;flex-direction:column;padding:48px 14px 10px;transform:translateY(-104%);transition:transform .38s cubic-bezier(.2,.9,.25,1);pointer-events:none}
.sheet.on{transform:translateY(0);pointer-events:auto}
.sheet.dragging{transition:none}
.bar{display:flex;align-items:center;gap:6px;height:54px;border-radius:27px;background:rgba(30,44,42,.92);box-shadow:0 0 0 1px var(--p-line) inset,0 10px 30px -12px rgba(0,0,0,.6);padding:0 6px 0 16px}
.bar>svg{width:21px;height:21px;fill:var(--p-mute);flex:none}
.bar input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--p-ink);font:inherit;font-size:16.5px;caret-color:var(--p-acc)}
.bar input::placeholder{color:#7F938E}
.ibtn{width:40px;height:40px;border-radius:20px;border:0;background:none;display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn svg{width:21px;height:21px;fill:var(--p-mute)}
.ibtn:hover{background:rgba(255,255,255,.07)}
.ibtn.rec{background:rgba(242,165,65,.18)}.ibtn.rec svg{fill:var(--p-acc);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.modes{display:flex;align-items:center;gap:10px;margin:12px 4px 4px}
.seg{position:relative;display:flex;background:rgba(30,44,42,.85);border-radius:18px;padding:3px;box-shadow:0 0 0 1px var(--p-line) inset}
.seg button{position:relative;z-index:1;border:0;background:none;padding:6px 16px;border-radius:15px;font-size:13px;font-weight:600;color:var(--p-mute);cursor:pointer;display:flex;gap:6px;align-items:center;transition:color .2s}
.seg button svg{width:14px;height:14px;fill:currentColor}
.seg button[aria-pressed="true"]{color:#1A1206}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;border-radius:15px;background:var(--p-acc);transition:transform .25s cubic-bezier(.2,.9,.25,1),width .25s}
.seg.ask .thumb{background:var(--p-acc2)}
.modes .note{font-size:11.5px;color:var(--p-mute);display:flex;align-items:center;gap:5px}
.modes .note svg{width:12px;height:12px;fill:currentColor}
.results{flex:1;overflow-y:auto;margin-top:6px;padding:4px 2px 20px;scrollbar-width:none}
.results::-webkit-scrollbar{display:none}

.sec{margin-top:14px}
.sec h4{margin:0 8px 7px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--p-mute);display:flex;justify-content:space-between}
.sec h4 small{font-weight:400;letter-spacing:0;text-transform:none}
.card{background:rgba(21,33,31,.88);border-radius:22px;overflow:hidden;box-shadow:0 0 0 1px var(--p-line) inset}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--p-ink)}
.row+.row{border-top:1px solid var(--p-line)}
.row:hover,.row.kb{background:rgba(255,255,255,.055)}
.row .tx{flex:1;min-width:0}
.row .t1{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12.5px;color:var(--p-mute);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .meta{font-size:11px;color:var(--p-mute);flex:none;align-self:flex-start;margin-top:3px;text-align:right}
mark{background:rgba(242,165,65,.28);color:inherit;border-radius:3px;padding:0 1px}
.score{display:none;font-family:var(--mono);font-size:10px;color:var(--p-acc2);background:rgba(126,212,191,.12);padding:1px 5px;border-radius:5px;margin-left:6px;vertical-align:1px;font-weight:400}
.show-scores .score{display:inline-block}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;color:#10201D}
.thumb-sm{width:36px;height:48px;border-radius:7px;flex:none;overflow:hidden;box-shadow:0 0 0 1px var(--p-line)}
.chipline{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.echip{font-size:11px;padding:2px 8px;border-radius:9px;background:rgba(242,165,65,.14);color:#F7C27B;font-family:var(--mono)}
.sw{width:40px;height:24px;border-radius:12px;background:#3A4A47;position:relative;flex:none;transition:background .2s;border:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#C5D3CF;transition:transform .2s,background .2s}
.sw.on{background:var(--p-acc2)}.sw.on::after{transform:translateX(16px);background:#0B2A24}
.top{padding:14px;display:flex;gap:14px;align-items:center}
.top .ico,.top .av{width:52px;height:52px}
.top .t1{font-size:17px}
.qa{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
.qa button{border:0;border-radius:16px;padding:7px 12px;font-size:12.5px;font-weight:500;background:rgba(255,255,255,.08);color:var(--p-ink);cursor:pointer;display:flex;gap:6px;align-items:center}
.qa button svg{width:14px;height:14px;fill:currentColor}
.qa button:hover{background:rgba(255,255,255,.14)}
.empty{padding:40px 20px;text-align:center;color:var(--p-mute);font-size:13.5px;line-height:1.5}
.recent{display:flex;flex-wrap:wrap;gap:8px;padding:2px 4px}
.recent button{border:0;border-radius:16px;padding:7px 13px;background:rgba(30,44,42,.9);box-shadow:0 0 0 1px var(--p-line) inset;color:var(--p-ink);font-size:13px;cursor:pointer}
.sugg-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 8px}
.sugg-apps .app{font-size:11px}

/* ask answer */
.answer{padding:16px 16px 14px;background:linear-gradient(160deg,rgba(126,212,191,.14),rgba(21,33,31,.92) 55%);border-radius:22px;box-shadow:0 0 0 1px rgba(126,212,191,.22) inset}
.answer .lbl{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--p-acc2);letter-spacing:.06em;text-transform:uppercase}
.answer .lbl svg{width:14px;height:14px;fill:currentColor}
.answer .body{margin-top:10px;font-size:15.5px;line-height:1.5}
.answer .body b{color:#FFE2B8;font-weight:600}
.answer .facts{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.answer .facts dt{color:var(--p-mute)}
.answer .facts dd{margin:0;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.answer .src{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.answer .src button{border:0;border-radius:12px;padding:4px 10px 4px 6px;font-size:11.5px;background:rgba(255,255,255,.08);color:var(--p-ink);cursor:pointer;display:flex;align-items:center;gap:5px}
.answer .src button i{display:grid;place-items:center;width:16px;height:16px;border-radius:5px;font-style:normal;font-size:9px;font-weight:700;color:#10201D;background:var(--p-acc2)}
.answer .src button:hover{background:rgba(255,255,255,.15)}
.typing::after{content:"▍";color:var(--p-acc2);animation:pulse .8s infinite}
.thinking{display:flex;gap:5px;padding:12px 0 2px}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--p-acc2);animation:bob 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-5px);opacity:.5}}
.privacy{margin:14px 8px 0;font-size:11px;color:var(--p-mute);display:flex;gap:6px;align-items:center}
.privacy svg{width:12px;height:12px;fill:currentColor}

/* ---------- detail screens ---------- */
.detail{position:absolute;inset:0;z-index:40;background:var(--p-bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.detail.on{transform:none}
.dhead{padding:46px 10px 10px;display:flex;align-items:center;gap:8px;background:var(--p-surf);border-bottom:1px solid var(--p-line)}
.dhead .ibtn svg{fill:var(--p-ink)}
.dhead .ttl{flex:1;min-width:0}
.dhead .ttl b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhead .ttl small{color:var(--p-mute);font-size:12px}
.dbody{flex:1;overflow-y:auto;padding:16px;scrollbar-width:none}
.dbody::-webkit-scrollbar{display:none}
.bubble{max-width:84%;padding:10px 13px;border-radius:18px 18px 18px 6px;background:var(--p-surf2);font-size:14px;line-height:1.45;margin-bottom:8px;white-space:pre-wrap;user-select:text}
.bubble.me{margin-left:auto;border-radius:18px 18px 6px 18px;background:#2B4A43}
.bubble.hl{box-shadow:0 0 0 1.5px var(--p-acc)}
.bubble time{display:block;margin-top:4px;font-size:10.5px;color:var(--p-mute)}
.daysep{text-align:center;font-size:11px;color:var(--p-mute);margin:10px 0}
.cc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0 22px}
.cc .av{width:96px;height:96px;font-size:38px}
.cc h2{margin:6px 0 0;font-size:24px;font-weight:500}
.cc p{margin:0;color:var(--p-mute)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.acts button{border:0;border-radius:18px;background:var(--p-surf2);padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.acts svg{width:20px;height:20px;fill:var(--p-acc2)}
.kv{background:var(--p-surf);border-radius:20px;overflow:hidden}
.kv div{padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.kv div+div{border-top:1px solid var(--p-line)}
.kv small{color:var(--p-mute);font-size:12px}
.kv span{font-size:15px;font-variant-numeric:tabular-nums}
.setrow{display:flex;align-items:center;gap:14px;padding:16px;background:var(--p-surf);border-radius:20px}
.setrow .tx{flex:1}
.setrow b{font-size:16px;font-weight:500}
.setrow p{margin:3px 0 0;color:var(--p-mute);font-size:12.5px}
.crumb{font-size:12px;color:var(--p-mute);margin:0 4px 12px}
.shot{border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px var(--p-line);background:#fff;color:#1b1b1b}
.ocr{margin-top:14px;font-size:12.5px;color:var(--p-mute);line-height:1.5}
.ocr b{color:var(--p-ink);font-weight:500}
.appsplash{flex:1;display:grid;place-items:center;text-align:center;color:var(--p-mute)}
.appsplash .ico{width:88px;height:88px;border-radius:26px;margin:0 auto 14px}
.appsplash .ico svg{width:44px;height:44px}

.toast{position:absolute;left:50%;bottom:38px;transform:translate(-50%,20px);background:#EAF2EF;color:#0B1514;padding:9px 16px;border-radius:18px;font-size:13px;font-weight:500;opacity:0;transition:.25s;z-index:70;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- dev panel ---------- */
.dev{width:340px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px}
.dev header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.dev h2{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
.dev header span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.dev h3{margin:0 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.qlist{display:flex;flex-direction:column;gap:2px;max-height:230px;overflow-y:auto;margin:0 -6px;padding:0 6px}
.qlist button{border:0;background:none;text-align:left;padding:7px 8px;border-radius:9px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13px}
.qlist button:hover{background:var(--chip)}
.qlist .m{flex:none;font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:5px;background:var(--chip);color:var(--muted);width:46px;text-align:center}
.qlist .m.ask{background:var(--accent);color:var(--accent-ink)}
.qlist small{color:var(--muted);font-size:11.5px;margin-left:auto;flex:none}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}
.opt label{cursor:pointer}
.opt input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.devbtns{display:flex;gap:8px}
.devbtns button{flex:1;border:1px solid var(--line);background:none;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500}
.devbtns button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stats{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:10px 12px;background:var(--chip);border-radius:10px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600;text-align:right}
.keys{font-size:12px;color:var(--muted);line-height:1.7}
.keys kbd{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;color:var(--ink)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
/* ---------- Dynamic Island (grows out of the punch-hole) ---------- */
.island{position:absolute;top:3px;left:50%;width:13px;height:13px;margin-top:10px;transform:translateX(-50%);z-index:58;background:#000;border-radius:20px;overflow:hidden;opacity:0;cursor:pointer;
  transition:width .5s cubic-bezier(.32,1.35,.45,1),height .5s cubic-bezier(.32,1.35,.45,1),border-radius .45s ease,margin .45s cubic-bezier(.32,1.35,.45,1),opacity .25s,box-shadow .4s;
  box-shadow:0 0 0 0 rgba(0,0,0,0)}
.island.live{opacity:1;margin-top:0}
.island.big{border-radius:36px;box-shadow:0 18px 40px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.05) inset;cursor:default}
.island.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:translateX(-50%) scale(1.06,1.1)}}
.island.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(calc(-50% - 4px))}40%,80%{transform:translateX(calc(-50% + 4px))}}
.iv{position:absolute;top:0;left:50%;transform:translateX(-50%);color:#fff;transition:opacity .28s ease,filter .35s ease,transform .45s cubic-bezier(.32,1.35,.45,1)}
.iv.out{opacity:0;filter:blur(6px);transform:translateX(-50%) scale(.92)}
.iv.in{opacity:0;filter:blur(8px);transform:translateX(-50%) scale(1.08)}
/* compact: left | camera gap | right */
.ic{height:33px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 9px;gap:40px;white-space:nowrap}
.ic .l,.ic .r{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;min-width:0}
.ic .r{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px}
.ig{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;flex:none}
.ig svg{width:12px;height:12px;fill:#fff}
.ig.sq{border-radius:6px}
/* mini alert (toast) */
.im{height:33px;display:flex;align-items:center;gap:8px;padding:0 16px 0 9px;white-space:nowrap;font-size:12.5px;font-weight:500}
.im .sp{width:30px;flex:none}
/* expanded */
.ie{padding:12px 16px 16px;font-size:13px}
.ie .hd{display:flex;align-items:center;justify-content:space-between;gap:44px;min-height:26px}
.ie .hd .l,.ie .hd .r{display:flex;align-items:center;gap:8px;min-width:0}
.ie .hd .r{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ie .ttl{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ie .sub{color:#A7B5B1;font-size:12.5px;margin-top:2px;line-height:1.4}
.ie .big{font-family:var(--mono);font-size:40px;font-weight:600;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;line-height:1}
.ie .row2{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.ie .btns{display:flex;gap:8px}
.ib{border:0;border-radius:22px;height:40px;min-width:40px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;background:#2A2F2E;transition:transform .12s,filter .15s}
.ib:hover{filter:brightness(1.15)}.ib:active{transform:scale(.94)}
.ib svg{width:17px;height:17px;fill:currentColor}
.ib.round{width:46px;height:46px;padding:0;border-radius:50%}
.ib.red{background:#E5484D}.ib.green{background:#30A46C}.ib.amber{background:#F2A541;color:#1A1206}.ib.teal{background:#7ED4BF;color:#0B2A24}
.ib.ghost{background:rgba(255,255,255,.1)}
.av.isl{width:44px;height:44px;font-size:17px}
.prog{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:14px}
.prog i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:linear-gradient(90deg,#F2A541,#FFC978);transition:width .8s ease}
.prog b{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#F2A541;display:grid;place-items:center;transition:left .8s ease;box-shadow:0 0 0 3px #000}
.prog b svg{width:12px;height:12px;fill:#1A1206}
.stages{display:flex;justify-content:space-between;margin-top:8px;font-size:10.5px;color:#7F8C89}
.stages span.on{color:#FFD9A0}
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-top:12px}
.route .st b{display:block;font-size:22px;font-weight:600;letter-spacing:-.5px}
.route .st small{color:#A7B5B1;font-size:11.5px}
.route .ln{height:2px;background:repeating-linear-gradient(90deg,#7ED4BF 0 6px,transparent 6px 11px);position:relative}
.route .ln svg{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;fill:#7ED4BF;background:#000;border-radius:4px}
.wave{display:flex;align-items:center;gap:2.5px;height:18px}
.wave i{width:3px;border-radius:2px;background:currentColor;height:30%;animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:-.2s}.wave i:nth-child(3){animation-delay:-.45s}.wave i:nth-child(4){animation-delay:-.1s}.wave i:nth-child(5){animation-delay:-.6s}.wave i:nth-child(6){animation-delay:-.35s}.wave i:nth-child(7){animation-delay:-.8s}
.wave.lg{height:34px;gap:4px}.wave.lg i{width:4px}
@keyframes wv{0%,100%{height:25%}50%{height:100%}}
.ring{width:21px;height:21px;border-radius:50%;background:conic-gradient(#30A46C var(--p,82%),rgba(255,255,255,.15) 0);display:grid;place-items:center;flex:none}
.ring::after{content:"";width:15px;height:15px;border-radius:50%;background:#000}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:#E5484D;animation:pulse 1s infinite}
/* second activity rides alongside as a bubble */
.island2{position:absolute;top:3px;left:50%;width:33px;height:33px;border-radius:50%;background:#000;z-index:58;display:grid;place-items:center;cursor:pointer;opacity:0;transform:scale(.3);pointer-events:none;
  transition:opacity .3s,transform .45s cubic-bezier(.32,1.35,.45,1),margin-left .45s cubic-bezier(.32,1.35,.45,1)}
.island2.live{opacity:1;transform:scale(1);pointer-events:auto}
.island2 .ig{width:23px;height:23px}
.statusbar{transition:opacity .25s}
.statusbar.hide{opacity:0}
.statusbar.tight .net,.statusbar.tight .pct{display:none}
.statusbar.noicons .icons{opacity:0}
.batt.chg i{border-color:#30A46C}.batt.chg i::after{background:#30A46C}
/* ---------- Search/Ask lives inside the island ---------- */
.sheet{left:50%;right:auto;bottom:auto;top:3px;width:13px;height:13px;margin-top:10px;padding:0;transform:translateX(-50%);z-index:57;background:#000;border-radius:20px;overflow:hidden;opacity:0;pointer-events:none;
  transition:width .55s cubic-bezier(.32,1.2,.45,1),height .55s cubic-bezier(.32,1.2,.45,1),margin .45s cubic-bezier(.32,1.2,.45,1),border-radius .45s ease,opacity .22s,transform .3s;
  box-shadow:0 24px 60px -18px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.06) inset}
.sheet.on{transform:translateX(-50%);margin-top:0;border-radius:34px;opacity:1;pointer-events:auto}
.sheet.dragging{transition:none}
.sheet-in{position:absolute;top:0;left:50%;width:356px;height:100%;transform:translateX(-50%);display:flex;flex-direction:column;padding:0 10px 10px;opacity:0;filter:blur(8px);transition:opacity .22s,filter .3s}
.sheet.on .sheet-in{opacity:1;filter:none;transition-delay:.12s}
.shd{height:33px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 2px;margin-bottom:6px}
.shd .seg{background:#141B1A;padding:2px}
.shd .seg button{padding:4px 11px;font-size:12px;gap:5px}
.shd .seg .thumb{top:2px;bottom:2px;left:2px}
.shd .note{max-width:165px;overflow:hidden;font-size:11px;color:#8FA29D;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:color .2s}
.shd .note span{overflow:hidden;text-overflow:ellipsis}
.shd .note svg{flex:none;width:12px;height:12px;fill:currentColor}
.shd .note.flash{color:#EAF2EF;font-weight:500}
.shd .note .ig{width:16px;height:16px}.shd .note .ig svg{width:10px;height:10px;fill:#fff}
.sheet .bar{flex:none;height:48px;border-radius:24px;background:#161F1E;box-shadow:0 0 0 1px rgba(255,255,255,.07) inset}
.sheet .results{flex:1;min-height:0;margin-top:2px;padding:2px 0 4px}
.sheet .sec h4{margin-left:6px}
.in-detail .sheet,.in-detail .scrim{opacity:0!important;pointer-events:none!important}
.searching .island:not(.alerting),.searching .island2{opacity:0!important;pointer-events:none!important}
.cam{cursor:pointer}
.dev .isl-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dev .isl-btns button{border:1px solid var(--line);background:none;border-radius:9px;padding:7px 8px;font-size:12.5px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:7px}
.dev .isl-btns button:hover{background:var(--chip)}
.dev .isl-btns svg{width:14px;height:14px;fill:var(--accent);flex:none}
</style>
</head>

const CONCEPTS = [
  'train ticket tickets pnr irctc rail railway berth express trn journey sbc mas',
  'otp code verification passcode',

].map(s => s.split(' '));
const CONCEPT_OF = {};
CONCEPTS.forEach((g, i) => g.forEach(w => (CONCEPT_OF[w] = CONCEPT_OF[w] || []).push(i)));

function norm(s) {
  return String(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/(\d),(?=\d)/g, '$1')           // 2,450 -> 2450, 1,02,450 -> 102450
    .replace(/₹|\brs\.?(?=\s*\d)|\binr\b/g, ' rs ')
    .replace(/wi-fi/g, 'wifi');
}
const tokens = s => norm(s).split(/[^a-z0-9]+/).filter(Boolean);

function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let pp = null, prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      // adjacent transposition counts as one edit (blutooth -> bluetooth)
      if (pp && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) cur[j] = Math.min(cur[j], pp[j - 2] + 1);
      best = Math.min(best, cur[j]);
    }
    if (best > max) return max + 1;

    const when = parseWhen(t);
    // "wake me up at 6:30" means morning; don't second-guess it
    if (when && when.assumed && /\bwake me\b/.test(lower) && when.date.getHours() < 12) when.assumed = false;
    if (!when) return { text: `What time should the alarm ring? Try “<b>alarm for 6:30 am</b>” or “<b>wake me up in 20 minutes</b>”.`, facts: [], sources: [byId('a-clock')], actions: [] };
    const repeat = /\b(every ?day|daily)\b/.test(lower) ? 'Every day' : /\bweekdays?\b/.test(lower) ? 'Mon–Fri' : /\bweekends?\b/.test(lower) ? 'Sat, Sun' : 'Once';
    const label = (t.match(/\b(?:called|named|labelled|label)\s+["“]?([^"”]+?)["”]?$/i) || [])[1] || 'Alarm';
    let al = ALARMS.find(a => +a.at === +when.date);
    if (al) al.on = true; else { al = { id: 'al' + alarmSeq++, at: when.date, repeat, label, on: true }; ALARMS.push(al); ALARMS.sort((a, b) => a.at - b.at); }
    nameAlarms();
    const ampm = when.assumed ? ` I took that as ${fmtTime(when.date)} — add “am” or “pm” to change it.` : '';
    return {
      text: `Alarm set for <b>${fmtTime(when.date)}</b> ${dayWord(when.date)}${repeat !== 'Once' ? `, repeating ${repeat}` : ''} — ${untilText(when.date)}.${ampm}`,
      facts: [], sources: [byId('a-clock')], actions: [{ label: 'Open Clock', icon: 'timer', open: 'a-clock' }, { label: 'Undo', icon: 'dnd', undoAlarm: al.id }],
      toggle: al, toggleSub: `${al.label} · ${fmtDay(al.at)} · ${repeat}`, done: `Alarm set for ${fmtTime(when.date)}`
    };
  }
  return null;
}

// Actions on the device: "turn on dark mode", "call amma"
function askAction(q) {
  const t = q.trim();
  const clock = clockAction(t); if (clock) return clock;
  let m = t.match(/^(?:please\s+)?(turn|switch|set)\s+(on|off)\s+(.+)$/i) || t.match(/^(?:please\s+)?(turn|switch)\s+(.+?)\s+(on|off)$/i) || t.match(/^(enable|disable)\s+()(.+)$/i);
  if (m) {
    let on, what;
    if (/enable|disable/i.test(m[1])) { on = /enable/i.test(m[1]); what = m[3]; }
    else if (/^(on|off)$/i.test(m[2])) { on = /on/i.test(m[2]); what = m[3]; }
    else { on = /on/i.test(m[3]); what = m[2]; }
    const hit = search(what, { kinds: ['setting'] }).all.find(r => r.doc.ref.toggle);
    if (hit) {
      const s = hit.doc.ref; s.on = on;
      return { text: `Done — <b>${s.name}</b> is now <b>${on ? 'on' : 'off'}</b>.${s.id === 's3' ? ' The phone UI is already dark in this prototype, so you won\'t see a visual change.' : ''}`, facts: [['Setting', `${s.path} › ${s.name}`]], sources: [s], actions: [], toggle: s, toggleSub: s.path, done: `${s.name} turned ${on ? 'on' : 'off'}` };
    }
  }
  m = t.match(/^(call|ring|dial|phone|message|text|whatsapp|msg)\s+(.+)$/i);
  if (m) {
    const hit = search(m[2], { kinds: ['contact'] }).top;
    if (hit) {
      const c = hit.doc.ref, isCall = /call|ring|dial|phone/i.test(m[1]);
      return { text: `${isCall ? 'Ready to call' : 'Ready to message'} <b>${c.name}</b> on <b>${c.phone}</b>.`, facts: [['Relation', c.rel]], sources: [c], actions: [{ label: isCall ? 'Call now' : 'Open chat', icon: isCall ? 'phone' : 'chat', call: isCall ? c.id : null, open: isCall ? null : c.id }] };
    }
  }
  m = t.match(/^(open|launch|start)\s+(.+)$/i);
  if (m) {
    const hit = search(m[2], { kinds: ['app'] }).top;
    if (hit) return { text: `Opening <b>${hit.doc.ref.name}</b>.`, facts: [], sources: [hit.doc.ref], actions: [{ label: 'Open ' + hit.doc.ref.name, icon: hit.doc.ref.icon, open: hit.doc.id }], autoOpen: hit.doc.id };
  }
  return null;
}

function ask(q) {
  const t0 = performance.now();
  let out = askAction(q), intent = out ? 'action' : null;
  if (!out) for (const it of INTENTS) if (it.re.test(q)) { out = it.run(q); intent = it.id; break; }
  if (!out) {
    const r = search(q);
    if (!r.all.length) out = { text: `I couldn't find anything on this phone about "<b>${escapeHtml(q)}</b>". Try different words, or switch to Search.`, facts: [], sources: [], actions: [] };
    else {
      const top = r.all.slice(0, 3).map(x => x.doc.ref);
      const lead = r.all[0].doc, leadText = lead.ref.text || lead.ref.ocr || lead.body;
      out = { text: `I don't have a direct answer, but the closest match is from <b>${escapeHtml(lead.title)}</b>: “${escapeHtml(leadText.slice(0, 140))}${leadText.length > 140 ? '…' : ''}”`, facts: [], sources: top, actions: [] };
    }
    intent = 'fallback';
  }
  out.intent = intent; out.ms = performance.now() - t0;
  return out;
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function highlight(text, qt) {
  let h = escapeHtml(text);
  const terms = qt.filter(w => w.length >= 2).sort((a, b) => b.length - a.length);
  if (!terms.length) return h;
  // match on digits ignoring thousands separators, and on word prefixes
  const pats = terms.map(w => /^\d+$/.test(w) ? w.split('').join(',?') : w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  return h.replace(new RegExp(`(?<![\\w])(${pats.join('|')})`, 'gi'), '<mark>$1</mark>');
}
</script>
<script>
/* ================= UI ================= */
const $ = s => document.querySelector(s);
const home = $('#home'), sheet = $('#sheet'), scrim = $('#scrim'), qEl = $('#q'), resultsEl = $('#results'), detail = $('#detail'), screenEl = $('#screen');
const SETTINGS0 = SETTINGS.map(s => s.on);
let mode = 'search', isOpen = false, kbIndex = -1, lastQ = '', typer = null, askTimer = null, stats = { queries: 0, ms: 0, docs: 0 };

/* ---- phone scaling so it fits any desktop viewport ---- */
function fitPhone() {
  const box = $('#phoneBox'), ph = $('#phone');
  const avW = Math.min(window.innerWidth - 32, 390), avH = window.innerHeight - 48;
  const s = Math.max(.55, Math.min(1, avW / 390, avH / 844));
  ph.style.transform = `scale(${s})`;
  box.style.width = 390 * s + 'px'; box.style.height = 844 * s + 'px';
}
window.addEventListener('resize', fitPhone);

/* ---- clock ---- */
function tickClock() {
  const t = NOW.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: false });
  $('#clockT').textContent = t; $('#sbTime').textContent = t;
  $('#clockD').textContent = NOW.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
}

/* ---- home icons ---- */
const appIco = (a, cls = '') => `<span class="ico ${cls}" style="background:${a.color}">${svg(a.icon)}</span>`;
function renderHome() {
  const btn = a => `<button class="app" data-open="${a.id}">${appIco(a)}<span>${a.name}</span></button>`;
  $('#grid').innerHTML = APPS.filter(a => !a.dock && !a.hidden).map(btn).join('');
  $('#dock').innerHTML = APPS.filter(a => a.dock).map(btn).join('');
}

/* ---- open / close: the island itself springs open into the search panel ---- */
const PANEL_W = 356;
const NOTE_HTML = `${svg('shield')}<span>On-device</span>`;
function sizeSheet() {
  if (!isOpen) return;
  const max = screenEl.clientHeight - 3 - 14;
  const h = 39 + 48 + 8 + resultsEl.offsetHeight + 24;       // header + search box + results + padding
  sheet.style.height = Math.min(max, Math.max(150, h)) + 'px';
}
function syncChrome() {
  const inDetail = detail.classList.contains('on');
  screenEl.classList.toggle('searching', isOpen && !inDetail);
  screenEl.classList.toggle('in-detail', isOpen && inDetail);
}
function openSearch(presetMode) {
  if (presetMode) setMode(presetMode);
  closeDetail(true);
  if (!isOpen && !sheet.style.width) {
    // start the morph from whatever shape the island has right now
    const isl = $('#island');
    if (isl.classList.contains('live')) {
      sheet.style.transition = 'none';
      sheet.style.width = isl.offsetWidth + 'px'; sheet.style.height = isl.offsetHeight + 'px';
      sheet.style.marginTop = '0px'; sheet.style.opacity = '1';
      void sheet.offsetWidth; sheet.style.transition = '';
    }
  }
  isOpen = true;
  sheet.style.marginTop = sheet.style.opacity = sheet.style.borderRadius = '';
  sheet.classList.add('on'); scrim.classList.add('on'); home.classList.add('dim');
  sheet.style.width = PANEL_W + 'px';
  render(); sizeSheet(); syncChrome();
  setTimeout(() => qEl.focus({ preventScroll: true }), 60);
}
function closeSearch() {
  isOpen = false; stopTyper();
  sheet.classList.remove('on'); scrim.classList.remove('on'); home.classList.remove('dim');
  sheet.style.width = sheet.style.height = ''; qEl.blur(); syncChrome();
}
new ResizeObserver(sizeSheet).observe(resultsEl);
new MutationObserver(syncChrome).observe(detail, { attributes: true, attributeFilter: ['class'] });
let noteT;
function flashNote(html) {
  const n = $('#shNote'); n.innerHTML = html; n.classList.add('flash');
  clearTimeout(noteT); noteT = setTimeout(() => { n.innerHTML = NOTE_HTML; n.classList.remove('flash'); }, 1700);
}

/* ---- mode toggle ---- */
function setMode(m) {
  mode = m;
  $('#mSearch').setAttribute('aria-pressed', m === 'search'); $('#mAsk').setAttribute('aria-pressed', m === 'ask');
  const seg = $('#seg'), btn = m === 'search' ? $('#mSearch') : $('#mAsk'), th = $('#segThumb');
  seg.classList.toggle('ask', m === 'ask');
  th.style.width = btn.offsetWidth + 'px'; th.style.transform = `translateX(${btn.offsetLeft - 3}px)`;
  qEl.placeholder = m === 'search' ? 'Search apps, messages, settings…' : 'Ask about your phone — “when is my train?”';
  $('#barIco').innerHTML = `<path d="${m === 'search' ? 'M9.5 3a6.5 6.5 0 0 1 5.2 10.4l5.4 5.4-1.4 1.4-5.4-5.4A6.5 6.5 0 1 1 9.5 3m0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9' : IC.sparkle}"/>`;
  $('#barIco').style.fill = m === 'ask' ? 'var(--p-acc2)' : '';
  render();
}

/* ---- rendering results ---- */
const KIND_LABEL = { app: 'Apps', contact: 'Contacts', setting: 'Settings', message: 'Messages & notifications', shot: 'Screenshots' };
const scoreTag = s => `<span class="score">${s.toFixed(3)}</span>`;
function avatar(c) { const ini = c.name.replace(/^Dr\.\s*/, '').split(' ').map(w => w[0]).slice(0, 2).join(''); return `<span class="av" style="background:${c.color}">${ini}</span>`; }
function msgIco(m) { const col = m.app === 'whatsapp' ? '#1FA855' : m.app === 'sms' ? '#3D7BD9' : '#8A6BD1'; return `<span class="ico sm" style="background:${col}">${svg(m.icon)}</span>`; }
function entChips(m) {
  const e = m.ent || {}, out = [];
  if (e.pnr) out.push('PNR ' + e.pnr);
  if (e.otp) out.push('OTP ' + e.otp);
  if (e.amount) out.push(inr(e.amount));
  if (e.date && e.date >= new Date(2026, 8, 22)) out.push(fmtDay(e.date));
  return out.length ? `<div class="chipline">${out.map(x => `<span class="echip">${x}</span>`).join('')}</div>` : '';
}
function snippet(text, qt) {
  const n = norm(text); let at = -1;
  for (const w of qt) { const i = n.search(new RegExp('\\b' + w.replace(/[^a-z0-9]/g, ''))); if (i >= 0 && (at < 0 || i < at)) at = i; }
  // norm() collapses "2,450" so offsets drift slightly; trim to a word boundary instead
  if (at > 50) { const cut = text.lastIndexOf(' ', Math.max(0, at - 30)); return '…' + text.slice(cut + 1); }
  return text;
}

function rowHTML(r, qt) {
  const d = r.doc, x = d.ref, sc = scoreTag(r.score);
  if (d.kind === 'app') return `<button class="row" data-open="${x.id}">${appIco(x, 'sm')}<div class="tx"><div class="t1">${highlight(x.name, qt)}${sc}</div><div class="t2">App</div></div></button>`;
  if (d.kind === 'contact') return `<button class="row" data-open="${x.id}">${avatar(x)}<div class="tx"><div class="t1">${highlight(x.name, qt)}${sc}</div><div class="t2">${escapeHtml(x.rel)} · ${highlight(x.phone, qt)}</div></div></button>`;
  if (d.kind === 'setting') return `<div class="row" data-open="${x.id}" role="button" tabindex="-1"><span class="ico sm" style="background:#34504B">${svg(x.icon)}</span><div class="tx"><div class="t1">${highlight(x.name, qt)}${sc}</div><div class="t2">${escapeHtml(x.path)} · ${escapeHtml(x.desc)}</div></div>${x.toggle ? `<button class="sw ${x.on ? 'on' : ''}" data-toggle="${x.id}" aria-label="Toggle ${escapeHtml(x.name)}" aria-pressed="${x.on}"></button>` : ''}</div>`;
  if (d.kind === 'message') return `<button class="row" data-open="${x.id}">${msgIco(x)}<div class="tx"><div class="t1">${highlight(x.from, qt)}${sc}</div><div class="t2">${highlight(snippet(x.text, qt), qt)}</div>${entChips(x)}</div><span class="meta">${ago(x.t)}</span></button>`;
  if (d.kind === 'shot') return `<button class="row" data-open="${x.id}"><span class="thumb-sm">${shotHTML(x, true)}</span><div class="tx"><div class="t1">${highlight(x.title, qt)}${sc}</div><div class="t2">Text in image: ${highlight(snippet(x.ocr, qt), qt)}</div></div><span class="meta">${ago(x.t)}</span></button>`;
}

function topHitHTML(r, qt) {
  const d = r.doc, x = d.ref; let lead, t1, t2, qa = [];
  if (d.kind === 'app') { lead = appIco(x); t1 = x.name; t2 = 'App · Top hit'; qa = [['Open', x.icon, `data-open="${x.id}"`]]; }
  else if (d.kind === 'contact') { lead = avatar(x); t1 = x.name; t2 = `${x.rel} · ${x.phone}`; qa = [['Call', 'phone', `data-call="${x.id}"`], ['Message', 'msg', `data-open="${x.id}"`], ['WhatsApp', 'chat', `data-open="${x.id}"`]]; }
  else if (d.kind === 'setting') { lead = `<span class="ico" style="background:#34504B">${svg(x.icon)}</span>`; t1 = x.name; t2 = `${x.path} · ${x.desc}`; qa = [['Open setting', 'gear', `data-open="${x.id}"`]]; }
  else if (d.kind === 'message') { lead = msgIco(x).replace('ico sm', 'ico'); t1 = x.from; t2 = x.text; const e = x.ent || {}; qa = [['Open', 'msg', `data-open="${x.id}"`]]; if (e.pnr) qa.push(['Copy PNR', 'doc', `data-copy="${e.pnr}"`]); if (e.otp) qa.push(['Copy OTP', 'doc', `data-copy="${e.otp}"`]); }
  else { lead = `<span class="thumb-sm" style="width:52px;height:68px">${shotHTML(x, true)}</span>`; t1 = x.title; t2 = 'Screenshot · ' + fmtDay(x.t); qa = [['View', 'gallery', `data-open="${x.id}"`]]; }
  return `<div class="sec"><h4>Top hit</h4><div class="card"><div class="row top" data-open="${x.id}" role="button" tabindex="-1">${lead}<div class="tx"><div class="t1">${highlight(t1, qt)}${scoreTag(r.score)}</div><div class="t2">${highlight(snippet(t2, qt), qt)}</div></div></div>
    <div class="qa">${qa.map(([l, i, a]) => `<button ${a}>${svg(i)}${l}</button>`).join('')}</div></div></div>`;
}

function renderIdle() {
  const recents = ['pnr', 'rent', 'otp', 'dark mode'];
  const sugg = ['a-irctc', 'a-gpay', 'a-wa', 'a-maps'].map(byId);
  const live = typeof ACT !== 'undefined' ? ordered().filter(a => a.summary) : [];
  const liveHTML = live.length ? `<div class="sec"><h4>Live now</h4><div class="card">${live.map(a => { const [t1, t2] = a.summary(); return `<button class="row" data-live="${a.id}">${a.bubble()}<div class="tx"><div class="t1">${t1}</div><div class="t2">${t2}</div></div></button>`; }).join('')}</div></div>` : '';
  resultsEl.innerHTML = liveHTML + (mode === 'search'
    ? `<div class="sec"><h4>Recent</h4><div class="recent">${recents.map(r => `<button data-q="${r}">${r}</button>`).join('')}</div></div>
       <div class="sec"><h4>Suggested apps</h4><div class="card sugg-apps">${sugg.map(a => `<button class="app" data-open="${a.id}">${appIco(a)}<span>${a.name}</span></button>`).join('')}</div></div>
       <div class="privacy">${svg('shield')}Everything is indexed and searched on this phone. Nothing leaves the device.</div>`
    : `<div class="sec"><h4>Try asking</h4><div class="recent">${DEMOS.filter(x => x.mode === 'ask').slice(0, 6).map(r => `<button data-q="${escapeHtml(r.q)}" data-mode="ask">${escapeHtml(r.q)}</button>`).join('')}</div></div>
       <div class="privacy">${svg('shield')}Answers come only from messages, screenshots and settings on this phone.</div>`);
}

function render() {
  const q = qEl.value.trim();
  $('#clearBtn').hidden = !q;
  kbIndex = -1;
  clearTimeout(askTimer);
  if (!q) { renderIdle(); return; }
  if (mode === 'search') renderSearch(q); else renderAsk(q);
}

function renderSearch(q) {
  const r = search(q);
  track(r.ms);
  const cmd = /^(set|turn|switch|call|remind|wake|open|text|message|enable|disable|start)\b|\b(alarm|timer)\b/i.test(q);
  const askRow = cmd || /\?$|^(when|what|how|where|who|which)\b/i.test(q) ? `<button class="row" data-mode-switch="ask" style="margin:6px 0 -4px;border-radius:18px;background:rgba(126,212,191,.1)"><span class="ico sm" style="background:#2F7D6D">${svg('sparkle')}</span><div class="tx"><div class="t1">${cmd ? 'Do' : 'Ask'} “${escapeHtml(q)}”</div><div class="t2">${cmd ? 'Switch to Ask to run this on the phone' : "Get a direct answer from your phone's data"}</div></div></button>` : '';
  if (!r.all.length && askRow) { resultsEl.innerHTML = askRow; return; }
  if (!r.all.length) { resultsEl.innerHTML = `<div class="empty">No matches for “${escapeHtml(q)}”.<br>Try fewer words, or <button class="linkish" data-mode-switch="ask" style="border:0;background:none;color:var(--p-acc2);cursor:pointer;padding:0;font:inherit">ask it as a question</button>.</div>`; return; }
  let html = topHitHTML(r.all[0], r.qt);
  for (const g of r.groups) {
    const items = g.items.filter(x => x !== r.all[0]);
    if (!items.length) continue;
    const total = r.all.filter(x => x.doc.kind === g.kind).length;
    html += `<div class="sec"><h4>${KIND_LABEL[g.kind]}<small>${total > items.length ? `${items.length} of ${total}` : ''}</small></h4><div class="card">${items.map(x => rowHTML(x, r.qt)).join('')}</div></div>`;
  }
  html = askRow + html;
  resultsEl.innerHTML = html + `<div class="privacy">${svg('shield')}${r.all.length} matches · ${r.ms.toFixed(1)} ms · on-device</div>`;
}

function renderAsk(q) {
  resultsEl.innerHTML = `<div class="answer"><div class="lbl">${svg('sparkle')}Answer</div><div class="thinking"><i></i><i></i><i></i></div></div>`;
  askTimer = setTimeout(() => {
    const a = ask(q); track(a.ms);
    if (a.toggle) toast(a.done);
    const bars = a.bars ? `<div style="margin-top:12px;display:flex;flex-direction:column;gap:6px">${a.bars.map(b => `<div style="display:grid;grid-template-columns:96px 1fr 64px;gap:8px;align-items:center;font-size:12px"><span style="color:var(--p-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(b.who)}</span><span style="height:8px;border-radius:4px;background:rgba(255,255,255,.07)"><span style="display:block;height:100%;border-radius:4px;background:var(--p-acc);width:${Math.max(3, b.amt / a.bars[0].amt * 100)}%"></span></span><span style="text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums">${inr(b.amt)}</span></div>`).join('')}</div>` : '';
    const facts = !a.bars && a.facts.length ? `<dl class="facts">${a.facts.map(([k, v]) => `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`).join('')}</dl>` : '';
    const tog = a.toggle ? `<div class="setrow" style="margin-top:12px;background:rgba(0,0,0,.2)"><div class="tx"><b>${a.toggle.name}</b><p>${escapeHtml(a.toggleSub || '')}</p></div><button class="sw ${a.toggle.on ? 'on' : ''}" data-toggle="${a.toggle.id}" aria-label="Toggle ${a.toggle.name}"></button></div>` : '';
    const acts = a.actions.length ? `<div class="qa" style="padding:12px 0 0">${a.actions.map(x => `<button ${x.open ? `data-open="${x.open}"` : ''} ${x.copy ? `data-copy="${x.copy}"` : ''} ${x.call ? `data-call="${x.call}"` : ''} ${x.toast ? `data-toast="${escapeHtml(x.toast)}"` : ''} ${x.undoAlarm ? `data-undo-alarm="${x.undoAlarm}"` : ''} ${x.activity ? `data-activity="${x.activity}"` : ''}>${svg(x.icon)}${escapeHtml(x.label)}</button>`).join('')}</div>` : '';
    const cd = a.countdown ? `<div id="cd" style="margin-top:14px;font-family:var(--mono);font-size:40px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums;color:var(--p-acc)"></div>` : '';
    const srcs = a.sources.length ? `<div class="src">${a.sources.map(s => `<button data-open="${s.id}"><i>${srcLetter(s)}</i>${escapeHtml(srcName(s))}</button>`).join('')}</div>` : '';
    resultsEl.innerHTML = `<div class="answer"><div class="lbl">${svg('sparkle')}Answer<span class="score" style="margin-left:auto">${a.intent} · ${a.ms.toFixed(1)} ms</span></div><div class="body" id="ansBody"></div>${cd}${facts}${bars}${tog}${acts}${srcs}</div>
      <div class="privacy">${svg('shield')}${a.intent === 'action' ? 'Done on this phone. Nothing was sent anywhere.' : a.sources.length ? `Answered on-device from ${a.sources.length} source${a.sources.length === 1 ? '' : 's'}. Tap a source to check it.` : 'Nothing on this phone matched.'}</div>`;
    if (a.countdown) startCountdown(a.countdown);
    typeOut($('#ansBody'), a.text);
    if (a.autoOpen) setTimeout(() => openItem(a.autoOpen), 700);
  }, 380);
}
let cdTimer = null;
function startCountdown(secs) {
  clearInterval(cdTimer);
  startTimer(secs, `${mmss(secs)} timer`);
  const paint = () => {
    const el = $('#cd'); if (!el) { clearInterval(cdTimer); return; }
    const t = ACT.get('timer');
    el.textContent = t ? mmss(Math.ceil(timerLeft(t))) + (t.paused ? ' · paused' : '') : 'Done';
  };
  paint(); cdTimer = setInterval(paint, 250);
}

function typeQuery(q, m) {
  if (!isOpen) openSearch();

}
function mic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition, btn = $('#micBtn');
  if (ACT.has('voice')) { stopVoice(); return; }
  startVoice(); btn.classList.add('rec');
  let done = false;
  const finish = text => {
    if (done) return; done = true; stopVoice();
    if (!text) return;
    qEl.value = text;
    if (/\?$|^(when|what|how|where|who|which|set|remind|call|turn|wake|open)\b/i.test(text)) setMode('ask'); else render();
  };
  // no mic (file://, blocked permission, unsupported browser): play a demo transcript instead
  const simulate = () => {
    const pool = DEMOS.filter(d => d.mode === 'ask'), q = pool[Math.floor(Math.random() * pool.length)].q, words = q.split(' ');
    let i = 0;
    const iv = setInterval(() => { voiceText(words.slice(0, ++i).join(' ')); if (i >= words.length) { clearInterval(iv); setTimeout(() => finish(q), 650); } }, 260);
  };

    const r = new SR(); let txt = '', failed = false;

    r.onresult = e => { txt = [...e.results].map(x => x[0].transcript).join(''); voiceText(txt); };
    r.onerror = () => { failed = true; if (!txt) simulate(); };
    r.onend = () => { if (txt) finish(txt); else if (!failed) finish(''); };
    r.start();
  } catch { simulate(); }
}

  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {

    rows.forEach((r, i) => r.classList.toggle('kb', i === kbIndex)); rows[kbIndex].scrollIntoView({ block: 'nearest' });

/* ---- swipe down on home (mouse or touch) to pull the sheet in ---- */
(function drag() {
  let y0 = null, dy = 0;
  const scale = () => $('#phone').getBoundingClientRect().height / 844;
  const start = y => { if (isOpen) return; y0 = y; dy = 0; delete home.dataset.dragged; };
  const move = y => {
    if (y0 == null) return;
    dy = Math.max(0, (y - y0) / scale());
    if (dy > 6) { home.dataset.dragged = '1'; home.classList.add('dragging'); sheet.classList.add('dragging');
      const p = Math.min(1, dy / 260);
      sheet.style.opacity = Math.min(1, p * 3); sheet.style.marginTop = 10 * (1 - p) + 'px'; sheet.style.pointerEvents = 'none';
      sheet.style.width = 13 + p * (PANEL_W - 13) + 'px'; sheet.style.height = 13 + p * 320 + 'px'; sheet.style.borderRadius = 20 + p * 14 + 'px';
      scrim.style.opacity = p; home.style.transform = `translateY(${Math.min(40, dy * .15)}px)`; }
  };
  const end = () => {
    if (y0 == null) return; y0 = null;
    home.classList.remove('dragging'); sheet.classList.remove('dragging');
    home.style.transform = ''; scrim.style.opacity = ''; sheet.style.pointerEvents = '';
    if (dy > 90) openSearch();
    else sheet.style.width = sheet.style.height = sheet.style.opacity = sheet.style.marginTop = sheet.style.borderRadius = '';
    setTimeout(() => delete home.dataset.dragged, 0);
  };
  home.addEventListener('mousedown', e => { if (e.target.closest('.pill')) return; e.preventDefault(); start(e.clientY); });
  window.addEventListener('mousemove', e => move(e.clientY));
  window.addEventListener('mouseup', end);
  home.addEventListener('touchstart', e => start(e.touches[0].clientY), { passive: true });
  home.addEventListener('touchmove', e => move(e.touches[0].clientY), { passive: true });
  home.addEventListener('touchend', end);
  // pulling down on the island or camera opens it too
  ['#island', '.cam'].forEach(sel => {
    $(sel).addEventListener('mousedown', e => start(e.clientY));
    $(sel).addEventListener('touchstart', e => start(e.touches[0].clientY), { passive: true });
    $(sel).addEventListener('touchmove', e => move(e.touches[0].clientY), { passive: true });
    $(sel).addEventListener('touchend', end);
  });
  // swipe up on the open sheet's empty area closes it
  let sy = null;
  sheet.addEventListener('mousedown', e => { if (e.target === sheet || e.target.closest('.shd') && !e.target.closest('button') || e.target.id === 'resultsScroll') sy = e.clientY; });
  window.addEventListener('mouseup', e => { if (sy != null && sy - e.clientY > 60) closeSearch(); sy = null; });
})();

let alertQ = [], alertOn = null, alertT = null, alertSeq = 0, charging = false, simSeq = 0, tickN = 0;

const glyph = (icon, bg, sq) => `<span class="ig ${sq ? 'sq' : ''}" style="background:${bg}">${svg(icon)}</span>`;
const wave = (lg, col) => `<span class="wave ${lg ? 'lg' : ''}" style="color:${col || '#30A46C'}">${'<i></i>'.repeat(7)}</span>`;
const mmss = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), p = n => String(n).padStart(2, '0'); return (h ? h + ':' + p(m) : m) + ':' + p(s % 60); };
const islAvatar = c => avatar(c).replace('class="av"', 'class="av isl"');

/* ---- view morphing: every state is a view; the island springs to its measured size ---- */
function balance(v) {
  const l = v.querySelector('.ic > .l'), r = v.querySelector('.ic > .r');
  if (!l || !r) return;
  l.style.minWidth = r.style.minWidth = '';
  const m = Math.max(l.offsetWidth, r.offsetWidth);
  l.style.minWidth = r.style.minWidth = m + 'px'; r.style.justifyContent = 'flex-end';
}
function setView(key, html, o = {}) {
  if (curKey === key && curView) {
    if (pDown || curView._html === html) return curView;      // don't swap buttons out from under a press
    curView.innerHTML = html; curView._html = html;
    if (!o.w) { curView.style.width = 'max-content'; balance(curView); }
    island.style.width = curView.offsetWidth + 'px'; island.style.height = curView.offsetHeight + 'px';
    offsetBubble(curView.offsetWidth);
    return curView;
  }
  curKey = key;
  const v = document.createElement('div');
  v.className = 'iv in'; v.innerHTML = html; v._html = html;
  v.style.width = o.w ? o.w + 'px' : 'max-content';
  island.appendChild(v);
  if (!o.w) balance(v);
  let big = !!o.big;
  if (o.maxW && v.offsetWidth > o.maxW && o.fallback) { v.innerHTML = o.fallback; v.style.width = '300px'; big = true; }
  const W = v.offsetWidth, H = v.offsetHeight;
  island.querySelectorAll('.iv').forEach(x => { if (x !== v) { x.classList.add('out'); setTimeout(() => x.remove(), 380); } });
  island.classList.add('live'); island.classList.toggle('big', big);
  island.style.width = W + 'px'; island.style.height = H + 'px';
  offsetBubble(W);
  void v.offsetWidth; v.classList.remove('in');   // styles are flushed, so this still transitions
  curView = v;
  return v;
}
function goIdle() {
  if (curKey === 'idle') return;
  curKey = 'idle'; curView = null;
  island.querySelectorAll('.iv').forEach(x => { x.classList.add('out'); setTimeout(() => x.remove(), 380); });
  island.classList.remove('live', 'big');
  island.style.width = island.style.height = '13px';
  statusMode(''); bubble(null);
}
function statusMode(m) { sbar.classList.toggle('hide', m === 'hide'); sbar.classList.toggle('tight', m === 'tight' || m === 'noicons'); sbar.classList.toggle('noicons', m === 'noicons'); }
function offsetBubble(W) { island2.style.marginLeft = (W / 2 + 6) + 'px'; }
function bubble(a) {
  if (!a) { island2.classList.remove('live'); return; }
  island2.innerHTML = a.bubble(); island2.dataset.id = a.id; island2.classList.add('live');
}
function fx(name) { island.classList.remove(name); void island.offsetWidth; island.classList.add(name); }

/* ---- what the island shows right now ---- */
function ordered() { return [...ACT.values()].sort((a, b) => (b.id === promoted) - (a.id === promoted) || b.pri - a.pri); }
function paint() {
  if (alertOn) return;
  const acts = ordered();
  const exp = acts.find(a => a.sticky) || (expandedId && ACT.get(expandedId));
  if (exp) { setView('e:' + exp.id, exp.expanded(), { w: 356, big: true }); statusMode('hide'); bubble(null); return; }
  if (!acts.length) { goIdle(); return; }
  setView('c:' + acts[0].id, `<div class="ic">${acts[0].compact()}</div>`);
  statusMode(acts[1] ? 'noicons' : 'tight');
  bubble(acts[1]);
}
function addAct(a, peek = true) {
  ACT.set(a.id, a);
  if (curKey && curKey.endsWith(':' + a.id)) curKey = null;
  if (peek && !a.sticky) {
    expandedId = a.id; clearTimeout(peekT);
    peekT = setTimeout(() => { if (expandedId === a.id && !hovering) { expandedId = null; paint(); } }, 3600);
  }
  paint(); fx('bump');
}
function removeAct(id) {
  ACT.delete(id);
  if (expandedId === id) expandedId = null;
  if (promoted === id) promoted = null;
  paint();
}

/* ---- transient alerts: toasts and notifications queue through the island ---- */
function showAlert(a) {
  if (a.mini) alertQ = alertQ.filter(x => !x.mini);   // a newer toast replaces a waiting one
  alertQ.push(a);
  if (!alertOn) nextAlert();
}
function nextAlert() {
  const a = alertQ.shift();
  if (!a) { alertOn = null; curKey = null; island.classList.remove('alerting'); paint(); return; }
  alertOn = a; island.classList.add('alerting');
  setView('a:' + (++alertSeq), a.html, a);
  statusMode(a.big || a.w ? 'hide' : 'tight'); bubble(null);
  if (a.fx) fx(a.fx);
  clearTimeout(alertT); alertT = setTimeout(dismissAlert, a.ms || 1800);
}
function dismissAlert() { clearTimeout(alertT); alertOn = null; nextAlert(); }

function islandToast(msg) {
  const [ic, col] = /copied/i.test(msg) ? ['doc', '#3D7BD9'] : /alarm|timer|snooz/i.test(msg) ? ['timer', '#F2A541'] : /reminder/i.test(msg) ? ['bell', '#F2A541']
    : /call/i.test(msg) ? ['phone', '#E5484D'] : /\bon$/i.test(msg) ? ['gear', '#30A46C'] : /\boff$/i.test(msg) ? ['gear', '#5E6B69'] : /charg/i.test(msg) ? ['bolt', '#5E6B69'] : ['sparkle', '#2F7D6D'];
  const right = /\boff$/i.test(msg) ? `<span style="color:#7F8C89">Off</span>` : /\bon$/i.test(msg) ? `<span style="color:#30A46C">On</span>` : glyph('check', '#30A46C');
  const html = `<div class="ic"><span class="l">${glyph(ic, col)}<span>${escapeHtml(msg)}</span></span><span class="r">${right}</span></div>`;
  const fallback = `<div class="ie" style="padding:10px 16px 14px"><div class="hd"><span class="l">${glyph(ic, col)}</span><span class="r">${glyph('check', '#30A46C')}</span></div><div style="margin-top:6px;font-size:14px;font-weight:500;line-height:1.35">${escapeHtml(msg)}</div></div>`;
  // while the island is being the search panel, confirmations show in its header instead
  if (screenEl.classList.contains('searching')) { flashNote(`${glyph(ic, col)}<span>${escapeHtml(msg)}</span>`); return; }
  showAlert({ html, fallback, maxW: 330, ms: 1700, fx: 'bump', mini: true });
}
function notify({ icon, color, app, title, body, actions = '', open, ms = 6500 }) {
  const html = `<div class="ie" data-iopen="${open || ''}"><div class="hd"><span class="l">${glyph(icon, color, true)}<span style="font-size:12px;color:#A7B5B1">${app}</span></span><span class="r" style="font-size:11px;color:#A7B5B1">now</span></div>
    <div style="margin-top:8px"><div class="ttl">${title}</div><div class="sub" style="color:#D9E2DF">${body}</div></div>${actions ? `<div class="btns" style="margin-top:12px">${actions}</div>` : ''}</div>`;
  showAlert({ html, w: 356, big: true, ms, fx: 'bump' });
}

/* ---- activities ---- */
const timerLeft = t => t.paused ? t.left : Math.max(0, (t.end - Date.now()) / 1000);
function startTimer(secs, label = 'Timer') {
  addAct({
    id: 'timer', pri: 80, total: secs, end: Date.now() + secs * 1000, left: secs, paused: false, label, open: 'a-clock',
    bubble() { return glyph('timer', '#F2A541'); },
    summary() { return [this.label, `${mmss(Math.ceil(timerLeft(this)))} left${this.paused ? ' · paused' : ''}`]; },
    compact() { return `<span class="l">${glyph('timer', '#F2A541')}${this.paused ? '<span style="color:#A7B5B1">Paused</span>' : ''}</span><span class="r" style="color:#F2A541;font-size:14px">${mmss(Math.ceil(timerLeft(this)))}</span>`; },
    expanded() {
      const left = timerLeft(this), pct = (1 - left / this.total) * 100;
      return `<div class="ie"><div class="hd"><span class="l">${glyph('timer', '#F2A541')}<span class="ttl">${this.label}</span></span><span class="r" style="color:#A7B5B1;font-size:12px">${mmss(this.total)}</span></div>
        <div class="row2"><span class="big" style="color:#F2A541">${mmss(Math.ceil(left))}</span><span class="btns"><button class="ib round ghost" data-iact="timer:cancel" aria-label="Cancel timer">${svg('x')}</button><button class="ib round amber" data-iact="timer:pause" aria-label="${this.paused ? 'Resume' : 'Pause'}">${svg(this.paused ? 'play' : 'pause')}</button></span></div>
        <div class="prog"><i style="width:${pct}%"></i></div></div>`;
    }
  });
}
function timerDone() {
  removeAct('timer');
  showAlert({ html: `<div class="ie"><div class="hd"><span class="l">${glyph('timer', '#F2A541')}<span class="ttl">Timer done</span></span><span class="r"><span class="pulse-dot" style="background:#F2A541"></span></span></div>
    <div class="row2"><span class="big" style="color:#F2A541">0:00</span><span class="btns"><button class="ib ghost" data-iact="timer:plus1">${svg('plus')}1 min</button><button class="ib amber" data-iact="alert:dismiss">Stop</button></span></div></div>`, w: 356, big: true, ms: 9000, fx: 'shake' });
}

function startCall(cid, answered) {
  const c = byId(cid);
  if (ACT.has('call')) removeAct('call');
  addAct({
    id: 'call', pri: 100, c, state: answered ? 'active' : 'calling', start: answered ? Date.now() : null, muted: false, spk: false,
    dur() { return this.start ? (Date.now() - this.start) / 1000 : 0; },
    bubble() { return glyph('phone', '#30A46C'); },
    summary() { return [`On call with ${this.c.name}`, this.state === 'calling' ? 'Calling…' : mmss(this.dur())]; },
    compact() { return `<span class="l">${glyph('phone', '#30A46C')}<span style="color:#30A46C">${this.state === 'calling' ? 'Calling' : mmss(this.dur())}</span></span><span class="r">${this.state === 'calling' ? '<span class="pulse-dot" style="background:#30A46C"></span>' : wave()}</span>`; },
    expanded() {
      return `<div class="ie"><div class="hd"><span class="l">${islAvatar(this.c)}<span><span class="ttl" style="display:block">${this.c.name}</span><span class="sub">${this.state === 'calling' ? 'Calling… · Mobile' : mmss(this.dur()) + (this.muted ? ' · Muted' : '')}</span></span></span><span class="r">${this.state === 'calling' ? '' : wave(true)}</span></div>
        <div class="row2" style="justify-content:flex-end"><span class="btns"><button class="ib round ${this.muted ? 'teal' : 'ghost'}" data-iact="call:mute" aria-label="Mute">${svg(this.muted ? 'micoff' : 'mic')}</button><button class="ib round ${this.spk ? 'teal' : 'ghost'}" data-iact="call:spk" aria-label="Speaker">${svg('vol')}</button><button class="ib round red" data-iact="call:end" aria-label="End call">${svg('hangup')}</button></span></div></div>`;
    }
  });
  if (!answered) setTimeout(() => { const a = ACT.get('call'); if (a && a.state === 'calling') { a.state = 'active'; a.start = Date.now(); paint(); } }, 2400);
}
function endCall() {
  const a = ACT.get('call'); if (!a) return;
  removeAct('call');
  if (detail.classList.contains('on') && $('#callStat')) closeDetail(true);
  toast(a.start ? `Call ended · ${mmss(a.dur())}` : 'Call cancelled');
}

function incomingCall(cid) {

    }
  });
}

/* ---- interaction ---- */
function islandAction(v) {
  const [k, act] = v.split(':'), a = ACT.get(k);
  if (k === 'alert') { dismissAlert(); return; }
  if (k === 'timer') {
    if (act === 'plus1') { dismissAlert(); startTimer(60, '1 min timer'); return; }
    if (!a) return;
    if (act === 'cancel') { removeAct('timer'); toast('Timer cancelled'); }
    if (act === 'pause') { if (a.paused) { a.end = Date.now() + a.left * 1000; a.paused = false; } else { a.left = timerLeft(a); a.paused = true; } paint(); }
  }
  if (k === 'call' && a) {
    if (act === 'mute') a.muted = !a.muted;
    if (act === 'spk') a.spk = !a.spk;
    if (act === 'end') { endCall(); return; }
    paint();
  }
  if (k === 'incoming' && a) {
    removeAct('incoming');
    if (act === 'accept') startCall(a.c.id, true); else toast(`Declined call · ${a.c.name}`);
  }
  if (k === 'alarm' && a) {
    removeAct('alarm');
    toast(act === 'snooze' ? 'Snoozed for 10 min' : 'Alarm stopped');
  }
  if (k === 'train') { removeAct('train'); toast('Train trip unpinned'); }
}

island.addEventListener('pointerdown', () => { pDown = true; });
window.addEventListener('pointerup', () => setTimeout(() => (pDown = false), 0));
island.addEventListener('mouseenter', () => (hovering = true));
island.addEventListener('mouseleave', () => (hovering = false));
island.addEventListener('click', e => {
  if (home.dataset.dragged) return;
  const b = e.target.closest('[data-iact]');
  if (b) { e.stopPropagation(); islandAction(b.dataset.iact); return; }
  if (e.target.closest('[data-open],[data-copy]')) {           // the page-wide handler runs next
    if (alertOn) dismissAlert();
    expandedId = null; paint(); return;
  }
  if (alertOn) { const op = e.target.closest('[data-iopen]'); dismissAlert(); if (op && op.dataset.iopen) openItem(op.dataset.iopen); return; }
  const acts = ordered(); if (!acts.length) { openSearch(); return; }
  if (acts.find(a => a.sticky)) return;
  if (!expandedId) { expandedId = acts[0].id; clearTimeout(peekT); paint(); return; }
  const a = ACT.get(expandedId); expandedId = null; paint();
  if (a && a.open) a.open === 'a-clock' ? clockScreen() : openItem(a.open);
});
// the camera is the way in: tap it to open Search, or to expand whatever is live
$('.cam').addEventListener('click', () => { if (home.dataset.dragged || isOpen) return; ACT.size ? island.click() : openSearch(); });
island2.addEventListener('click', e => { e.stopPropagation(); promoted = island2.dataset.id; expandedId = null; paint(); fx('bump'); });
document.addEventListener('pointerdown', e => {
  if (expandedId && !island.contains(e.target) && !island2.contains(e.target)) { expandedId = null; paint(); }
}, true);
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (expandedId || alertOn)) { e.stopImmediatePropagation(); if (alertOn) dismissAlert(); else { expandedId = null; paint(); } }
}, true);
document.addEventListener('click', e => { if (e.target.closest('[data-endcall]')) endCall(); });
$('#islBtns').addEventListener('click', e => {
  const b = e.target.closest('[data-sim]'); if (!b) return;
  ({
    otp: incomingOTP, wa: incomingWA, call: () => ACT.has('incoming') || incomingCall('c13'),
    delivery: startDelivery, timer: () => startTimer(60, '1 min timer'), train: pinTrain, alarm: ringAlarm, charge: toggleCharging
  })[b.dataset.sim]();
});

/* ---- one clock drives every live activity ---- */
setInterval(() => {
  tickN++;
  const t = ACT.get('timer'); if (t && !t.paused && timerLeft(t) <= 0) timerDone();
  const d = ACT.get('delivery');
  if (d) { d.eta = Math.max(0, 32 - Math.floor((Date.now() - d.t0) / 2000)); if (!d.eta) { removeAct('delivery'); notify({ icon: 'food', color: '#FC8019', app: 'Swiggy', title: 'Order delivered', body: 'Enjoy your meal! Rate Ravi and Meghana Foods.', open: 'm6', ms: 5000 }); } }
  const inc = ACT.get('incoming'); if (inc && Date.now() - inc.t0 > 20000) { removeAct('incoming'); toast(`Missed call · ${inc.c.name}`); }
  if (!alertOn && tickN % 2 === 0 && ordered().some(a => a.ring)) fx('shake');
  const c = ACT.get('call'), cs = $('#callStat'); if (cs) cs.textContent = c ? (c.state === 'calling' ? 'Calling · ' + c.c.phone : mmss(c.dur()) + ' · ' + c.c.phone) : 'Call ended';
  paint();
}, 1000);

function islandReset() {
  ACT.clear(); alertQ = []; alertOn = null; clearTimeout(alertT); expandedId = null; promoted = null;
  charging = false; $('#batt').classList.remove('chg');
  MESSAGES.splice(BASE_MSGS); buildIndex(); curKey = null; goIdle();
  setTimeout(pinTrain, 600);
}

// open with the upcoming trip pinned, so the island is visible from the first frame
setTimeout(pinTrain, 900);
</script>
</body>
